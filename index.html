<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gaming Zone</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

h1 {
  color: #22c55e;
}

table {
  width: 90%;
  margin: auto;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #444;
  padding: 10px;
}

.libre {
  color: #22c55e;
}

.occupe {
  color: red;
}

button {
  padding: 6px 10px;
  background: #22c55e;
  border: none;
  color: white;
  cursor: pointer;
}

</style>
</head>

<body>

<h1>🎮 Gaming Center</h1>

<h2>Postes disponibles</h2>

<table id="table">
<thead>
<tr>
<th>Type</th>
<th>Nom</th>
<th>Statut</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

<br><br>

<h2>Réserver</h2>

<input id="nom" placeholder="Nom"><br><br>

<select id="service">
<option>PS4</option>
<option>PS5</option>
<option>VR2</option>
<option>VOLANT</option>
</select><br><br>

<select id="duree">
<option>1h</option>
<option>2h</option>
<option>3h</option>
<option>journée</option>
</select><br><br>

<input id="date" type="date"><br><br>
<input id="heure" type="time"><br><br>

<textarea id="message" placeholder="Message"></textarea><br><br>

<button onclick="reserver()">Réserver</button>

<p style="color:red">
La réservation est confirmée après validation sur WhatsApp
</p>

<script>

const API = "COLLE TON LIEN ICI";

function charger() {
  fetch(API)
  .then(res => res.json())
  .then(data => {
    let tbody = document.querySelector("#table tbody");
    tbody.innerHTML = "";

    data.forEach(p => {
      let statutClass = p.statut === "libre" ? "libre" : "occupe";

      tbody.innerHTML += `
        <tr>
          <td>${p.type}</td>
          <td>${p.nom}</td>
          <td class="${statutClass}">${p.statut}</td>
          <td>
            ${p.statut === "libre" ? `<button onclick="choisir('${p.type}')">Réserver</button>` : "❌"}
          </td>
        </tr>
      `;
    });
  });
}

function choisir(type){
  document.getElementById("service").value = type;
}

function reserver(){
  let nom = document.getElementById("nom").value;
  let service = document.getElementById("service").value;
  let duree = document.getElementById("duree").value;
  let date = document.getElementById("date").value;
  let heure = document.getElementById("heure").value;
  let message = document.getElementById("message").value;

  let texte = `Bonjour, je veux réserver:\nNom: ${nom}\nService: ${service}\nDurée: ${duree}\nDate: ${date}\nHeure: ${heure}\nMessage: ${message}`;

  let whatsapp = "https://wa.me/2250576066244?text=" + encodeURIComponent(texte);

  window.open(whatsapp, "_blank");

  fetch(API, {
    method: "POST",
    body: JSON.stringify({nom, service, duree, date, heure, message})
  });

  alert("Demande envoyée !");
}

charger();

</script>

</body>
</html>
