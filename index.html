<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gaming Center Bouaké</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

h1 {
  color: #00ffcc;
}

table {
  width: 90%;
  margin: auto;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #333;
  padding: 10px;
}

.status-libre { color: #00ff00; }
.status-occupe { color: red; }
.status-reserve { color: orange; }

button {
  padding: 8px;
  background: #00ffcc;
  border: none;
  cursor: pointer;
}

button:disabled {
  background: gray;
  cursor: not-allowed;
}

input, select, textarea {
  margin: 5px;
  padding: 8px;
  width: 250px;
}

.hidden { display: none; }

.warning {
  color: red;
  font-weight: bold;
}

.call-btn {
  background: green;
  color: white;
  padding: 10px;
  margin: 10px;
  display: inline-block;
}
</style>
</head>

<body>

<h1>🎮 Gaming Center Bouaké</h1>

<a class="call-btn" href="tel:+2250576066244">📞 Appeler</a>

<h2>Postes disponibles</h2>

<table>
<thead>
<tr>
<th>Type</th>
<th>Nom</th>
<th>Statut</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<h2>Réserver</h2>

<form id="form">

<input id="nom" placeholder="Nom"><br>

<select id="service">
<option value="PS4">PS4</option>
<option value="PS5">PS5</option>
<option value="VR2">VR2</option>
<option value="ACHAT">Achat console / accessoires</option>
</select><br>

<div id="durationBox">
<select id="duree">
<option value="1h">1h</option>
<option value="2h">2h</option>
<option value="journée">Journée complète</option>
<option value="location">Location</option>
</select>
</div><br>

<input type="date" id="date"><br>
<input type="time" id="heure"><br>

<textarea id="message" placeholder="Message"></textarea><br>

<input type="text" id="website" class="hidden">

<button type="button" onclick="reserver()">Réserver</button>

</form>

<p class="warning">
La réservation est confirmée après validation sur WhatsApp
</p>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzAkkWGNjVYjy5732R11ARmyT80rHsbwvIY2TAs_CLAYQbrxctuo8jyOfFFn9C_MiGzeA/exec";
const WHATSAPP = "2250576066244";

let postes = [];

async function load() {

  const table = document.getElementById("tableBody");

  try {
    const res = await fetch(API_URL);
    postes = await res.json();

    table.innerHTML = "";

    postes.forEach(p => {

      let statusClass = "status-libre";
      let disabled = "";

      if (p.statut === "occupé") {
        statusClass = "status-occupe";
        disabled = "disabled";
      }

      if (p.statut === "réservé") {
        statusClass = "status-reserve";
        disabled = "disabled";
      }

      const row = `
      <tr>
        <td>${p.type || "-"}</td>
        <td>${p.nom || "-"}</td>
        <td class="${statusClass}">${p.statut || "-"}</td>
        <td>
          <button ${disabled} onclick="selectPoste('${p.nom}')">
            ${disabled ? "Complet" : "Réserver"}
          </button>
        </td>
      </tr>
      `;

      table.innerHTML += row;
    });

  } catch(e) {
    table.innerHTML = "<tr><td colspan='4'>Erreur chargement</td></tr>";
  }
}

function selectPoste(nom) {
  document.getElementById("message").value = "Je veux réserver " + nom;
}

document.getElementById("service").addEventListener("change", function() {
  if (this.value === "ACHAT") {
    document.getElementById("durationBox").style.display = "none";
  } else {
    document.getElementById("durationBox").style.display = "block";
  }
});

function reserver() {

  const nom = document.getElementById("nom").value;
  const service = document.getElementById("service").value;
  const duree = document.getElementById("duree").value;
  const date = document.getElementById("date").value;
  const heure = document.getElementById("heure").value;
  const message = document.getElementById("message").value;

  if (!nom || !service || !date || !heure) {
    alert("Remplis les champs");
    return;
  }

  let text =
    "Gaming Center Bouaké\n\n" +
    "Nom: " + nom + "\n" +
    "Service: " + service + "\n";

  if (service !== "ACHAT") {
    text += "Durée: " + duree + "\n";
  }

  text +=
    "Date: " + date + "\n" +
    "Heure: " + heure + "\n" +
    "Message: " + message;

  window.open(
    "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(text),
    "_blank"
  );
}

load();

</script>

</body>
</html>
