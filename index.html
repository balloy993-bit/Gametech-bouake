<script>
const API_URL = "TON_LIEN_EXEC_ICI";
const WHATSAPP_NUMBER = "225XXXXXXXXXX";

// ⏱ temps de début du formulaire
const formStartedAt = Date.now();

// 🔁 normalisation (corrige undefined)
function normalizeItem(item) {
  return {
    type: item.type || item.TYPE || "",
    nom: item.nom || item.NOM || "",
    statut: item.statut || item.STATUT || "",
    date: item.date || item.DATE || "",
    debut: item.debut || item.DEBUT || "",
    fin: item.fin || item.FIN || ""
  };
}

// 🎨 style statut
function statusClass(status) {
  const s = String(status).toLowerCase();
  if (s === "libre") return "status-libre";
  if (s === "réservé" || s === "reserve") return "status-reserve";
  return "status-occupe";
}

// 📊 charger tableau
async function chargerPostes() {
  const tableBody = document.getElementById("tableBody");
  tableBody.innerHTML = "<tr><td colspan='7'>Chargement...</td></tr>";

  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    tableBody.innerHTML = "";

    data.map(normalizeItem).forEach(p => {
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${p.type || "-"}</td>
        <td>${p.nom || "-"}</td>
        <td class="${statusClass(p.statut)}">${p.statut || "-"}</td>
        <td>${p.date || "-"}</td>
        <td>${p.debut || "-"}</td>
        <td>${p.fin || "-"}</td>
        <td><button onclick="selectPoste('${p.nom}')">Réserver</button></td>
      `;

      tableBody.appendChild(tr);
    });

  } catch (e) {
    tableBody.innerHTML = "<tr><td colspan='7'>Erreur</td></tr>";
  }
}

// 📌 sélection rapide
function selectPoste(nom) {
  document.getElementById("message").value = "Je veux réserver " + nom;
}

// 📤 réservation sécurisée
async function reserver() {

  const nom = document.getElementById("nom").value.trim();
  const service = document.getElementById("service").value.trim();
  const duree = document.getElementById("duree").value.trim();
  const date = document.getElementById("date").value;
  const heure = document.getElementById("heure").value;
  const message = document.getElementById("message").value.trim();
  const website = document.getElementById("website").value;

  const elapsed = (Date.now() - formStartedAt) / 1000;

  // 🚫 anti-bot
  if (website) {
    alert("Spam détecté");
    return;
  }

  if (elapsed < 3) {
    alert("Attends un peu avant d’envoyer");
    return;
  }

  if (!nom || !service || !date || !heure) {
    alert("Remplis les champs obligatoires");
    return;
  }

  // 📡 envoi vers Google Sheet
  try {
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        nom,
        service,
        duree,
        date,
        heure,
        message,
        website,
        elapsedSeconds: elapsed
      })
    });
  } catch (e) {}

  // 📲 WhatsApp auto
  let text =
    "Bonjour Gaming Center Bouaké,%0A%0A" +
    "Nom : " + encodeURIComponent(nom) + "%0A" +
    "Service : " + encodeURIComponent(service) + "%0A" +
    "Durée : " + encodeURIComponent(duree) + "%0A" +
    "Date : " + encodeURIComponent(date) + "%0A" +
    "Heure : " + encodeURIComponent(heure) + "%0A" +
    "Message : " + encodeURIComponent(message);

  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, "_blank");
}

// 🚀 lancer
chargerPostes();
